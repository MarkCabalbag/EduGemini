openapi: 3.1.0
info:
  title: EduGemini API
  version: 1.0.0
  summary: Contract for the EduGemini web client and grading worker.
  description: |
    Machine-readable contract for the endpoints in docs/api-spec.md. The
    Markdown document holds the rules and the reasoning; this file holds the
    shapes. Operation IDs equal the endpoint IDs in the Markdown (AUTH-01 and
    so on). Errors use one envelope (see components/schemas/Error) and the
    codes in components/schemas/ErrorCode.

    Status draft: list-valued and deeply nested fields are described with their
    key properties. The full field list is completed at scaffold, when the shared
    Zod schemas are generated from the same definitions and checked in CI.
  license:
    name: Proprietary (portfolio project)
servers:
  - url: /
    description: Same origin as the web app (Vercel rewrite to the API host).
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Account
  - name: Instructor key
  - name: Classes
  - name: Joining and people
  - name: Assignments
  - name: Reference files
  - name: Student submission
  - name: Files
  - name: Instructor review
  - name: Bulk actions
  - name: Review queue
  - name: Tracker and gradebook
  - name: Announcements
  - name: Notifications
  - name: Admin
  - name: System
paths:
  /api/auth/signup:
    post:
      operationId: AUTH-01
      tags: [Auth]
      summary: Sign up
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created and signed in. Sets eg_session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/auth/signin:
    post:
      operationId: AUTH-02
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigninRequest' }
      responses:
        '200':
          description: Signed in. Sets eg_session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '400': { $ref: '#/components/responses/Validation' }

  /api/auth/signout:
    post:
      operationId: AUTH-03
      tags: [Auth]
      summary: Sign out
      responses:
        '204': { description: "Signed out. Clears eg_session." }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/signout-all:
    post:
      operationId: AUTH-04
      tags: [Auth]
      summary: Sign out of all devices
      responses:
        '204': { description: "All sessions removed." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/forgot-password:
    post:
      operationId: AUTH-05
      tags: [Auth]
      summary: Request a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Always the same response, whether or not the account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '400': { $ref: '#/components/responses/Validation' }

  /api/auth/reset-password:
    post:
      operationId: AUTH-06
      tags: [Auth]
      summary: Set a new password from a reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: "Password changed; all sessions removed." }
        '400': { $ref: '#/components/responses/Validation' }

  /api/auth/verify-email:
    post:
      operationId: AUTH-07
      tags: [Auth]
      summary: Verify email with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerified' }
        '400': { $ref: '#/components/responses/Validation' }

  /api/auth/resend-verification:
    post:
      operationId: AUTH-08
      tags: [Auth]
      summary: Resend the verification email
      responses:
        '202': { description: "Verification email queued." }
        '204': { description: "Already verified; nothing sent." }
        '429': { $ref: '#/components/responses/RateLimited' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me:
    get:
      operationId: ACC-01
      tags: [Account]
      summary: Get the current user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: ACC-02
      tags: [Account]
      summary: Update name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: ACC-04
      tags: [Account]
      summary: Delete own account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: "Account deleted. Clears eg_session." }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/me/password:
    post:
      operationId: ACC-03
      tags: [Account]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: "Password changed. Other sessions stay signed in." }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/me/deletion-impact:
    get:
      operationId: ACC-07
      tags: [Account]
      summary: Preview what deleting the account removes
      responses:
        '200':
          description: Counts for the confirmation screen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionImpact' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/preferences:
    get:
      operationId: ACC-05
      tags: [Account]
      summary: Get notification preferences
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: ACC-06
      tags: [Account]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/key:
    get:
      operationId: KEY-01
      tags: [Instructor key]
      summary: Get key status (never the key)
      responses:
        '200':
          description: Key status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: KEY-02
      tags: [Instructor key]
      summary: Save a Gemini key (validated first)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeySaveRequest' }
      responses:
        '200':
          description: Key validated, encrypted, and stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: KEY-03
      tags: [Instructor key]
      summary: Remove the key
      responses:
        '204': { description: "Key removed. Queued grading moves to manual review." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/key/test:
    post:
      operationId: KEY-04
      tags: [Instructor key]
      summary: Test the saved key
      responses:
        '200':
          description: Key status after the test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/classes:
    get:
      operationId: CLS-01
      tags: [Classes]
      summary: List classes
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of classes the caller can see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfClassSummary' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: CLS-02
      tags: [Classes]
      summary: Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassCreate' }
      responses:
        '201':
          description: Class created with its join code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/classes/{classId}:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: CLS-03
      tags: [Classes]
      summary: Get a class
      responses:
        '200':
          description: Class (instructor view includes counts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: CLS-04
      tags: [Classes]
      summary: Edit class details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: CLS-07
      tags: [Classes]
      summary: Delete a class permanently
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypedConfirmation' }
      responses:
        '204': { description: "Class and its data deleted." }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/classes/{classId}/archive:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      operationId: CLS-05
      tags: [Classes]
      summary: Archive a class (idempotent)
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/classes/{classId}/restore:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      operationId: CLS-06
      tags: [Classes]
      summary: Restore an archived class (idempotent)
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/classes/{classId}/code/regenerate:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      operationId: CLS-08
      tags: [Classes]
      summary: Issue a new join code (also re-enables a disabled code)
      responses:
        '200':
          description: New code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/classes/{classId}/code/disable:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      operationId: CLS-09
      tags: [Classes]
      summary: Disable the join code (idempotent)
      responses:
        '200':
          description: Code disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/classes/{classId}/settings:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    patch:
      operationId: CLS-10
      tags: [Classes]
      summary: Change join approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassSettings' }
      responses:
        '200':
          description: Setting saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSettingsResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/classes/{classId}/deletion-impact:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: CLS-11
      tags: [Classes]
      summary: Preview what deleting the class removes
      responses:
        '200':
          description: Counts and a gradebook download path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassDeletionImpact' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/join:
    post:
      operationId: JOIN-01
      tags: [Joining and people]
      summary: Join a class with a code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '201':
          description: New enrollment (ACTIVE or PENDING).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '200':
          description: Already joined; same body, no new enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/join/{code}:
    get:
      operationId: JOIN-02
      tags: [Joining and people]
      summary: Preview a join link
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 8 } }
      responses:
        '200':
          description: Class name and instructor first name only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/me/enrollments:
    get:
      operationId: JOIN-03
      tags: [Joining and people]
      summary: List my enrollments (Enrolled list)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of enrollments (REMOVED excluded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfEnrollmentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/classes/{classId}/people:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: PPL-01
      tags: [Joining and people]
      summary: List people in a class
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, PENDING, DECLINED, REMOVED] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Counts (always complete) and one page of enrollments, oldest join first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeoplePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/enrollments/{enrollmentId}/decision:
    parameters:
      - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: PPL-02
      tags: [Joining and people]
      summary: Approve, decline, reverse, or remove an enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentDecisionRequest' }
      responses:
        '200':
          description: Updated enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/classes/{classId}/approve-pending:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      operationId: PPL-03
      tags: [Joining and people]
      summary: Approve all pending enrollments (after approval is turned off)
      responses:
        '200':
          description: Count approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproveAllResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/classes/{classId}/assignments:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: ASG-01
      tags: [Assignments]
      summary: List assignments (students see published only)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] } }
        - { name: labelId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [dueAt], default: dueAt } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfAssignmentSummary' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: ASG-02
      tags: [Assignments]
      summary: Create an assignment draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/assignments/{assignmentId}:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      operationId: ASG-03
      tags: [Assignments]
      summary: Get an assignment
      responses:
        '200':
          description: Assignment (instructor view includes counts; student view includes my state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: ASG-04
      tags: [Assignments]
      summary: Edit an assignment (criteria changes need an impact token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: ASG-09
      tags: [Assignments]
      summary: Delete an assignment permanently
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypedConfirmation' }
      responses:
        '204': { description: "Deleted with its submissions and files." }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/criteria-impact:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: ASG-05
      tags: [Assignments]
      summary: Preview the re-grade impact of a proposed criteria change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriteriaImpactRequest' }
      responses:
        '200':
          description: Counts and a signed impact token (10 minutes).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriteriaImpact' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/publish:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: ASG-06
      tags: [Assignments]
      summary: Publish an assignment (warnings returned, not blocking)
      responses:
        '200':
          description: Published, with any warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/assignments/{assignmentId}/archive:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: ASG-07
      tags: [Assignments]
      summary: Archive an assignment (idempotent)
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/restore:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: ASG-08
      tags: [Assignments]
      summary: Restore an archived assignment (idempotent)
      responses:
        '200':
          description: Restored to published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/classes/{classId}/labels:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: ASG-10
      tags: [Assignments]
      summary: List labels (instructors)
      responses:
        '200':
          description: Labels with assignment counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: ASG-11
      tags: [Assignments]
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelInput' }
      responses:
        '201':
          description: Label created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/labels/{labelId}:
    parameters:
      - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: ASG-12
      tags: [Assignments]
      summary: Delete a label (assignments keep existing, unlabeled)
      responses:
        '204': { description: "Label deleted." }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/reference-files:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: REF-01
      tags: [Reference files]
      summary: Add a reference file (criteria change)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReferenceUpload' }
      responses:
        '201':
          description: Reference file stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceFileView' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/reference-files/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/FileId' }
    patch:
      operationId: REF-02
      tags: [Reference files]
      summary: Change student visibility of a reference file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceFileVisibility' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceFileView' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: REF-03
      tags: [Reference files]
      summary: Remove a reference file (criteria change; needs impact token header)
      parameters:
        - { name: X-Impact-Token, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: "Removed." }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/reference-files/{fileId}/url:
    parameters:
      - { $ref: '#/components/parameters/FileId' }
    get:
      operationId: REF-04
      tags: [Reference files]
      summary: Get a five-minute link to a reference file
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUrl' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/me:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      operationId: SUB-01
      tags: [Student submission]
      summary: Get my submission for an assignment
      description: >-
        state is UPLOADING only while an upload is open and nothing is stored yet. Once a version is stored the state is the
        submission's, and an upload open for a resubmission is draftVersion. While an upload is open, draftVersion.files
        lists the files stored in it, so the page can pick the upload up again after a reload.
      responses:
        '200':
          description: My state, attempts, grade (when shown), and files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSubmission' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/versions:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: SUB-02
      tags: [Student submission]
      summary: Open an upload version (idempotent while one is open)
      responses:
        '200':
          description: The open version (already existed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionView' }
        '201':
          description: New version opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/versions/{versionId}:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
    delete:
      operationId: SUB-06
      tags: [Student submission]
      summary: Cancel an open upload
      responses:
        '204': { description: "Cancelled." }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/versions/{versionId}/files/{clientFileId}:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
      - { $ref: '#/components/parameters/ClientFileId' }
    put:
      operationId: SUB-03
      tags: [Student submission]
      summary: Send one file (raw bytes; idempotent per clientFileId)
      parameters:
        - { name: X-File-Name, in: header, required: false, description: 'Without it the name shown is "file".', schema: { type: string, maxLength: 340 } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/heic: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Replaced an existing file with the same clientFileId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileView' }
        '201':
          description: File stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/FileError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: SUB-04
      tags: [Student submission]
      summary: Remove a file from an open upload
      description: >-
        Removing a file that is already gone, or was never stored, is also 204. 409 is UPLOAD_NOT_OPEN. The file's object
        is queued for deletion and its place is free again.
      responses:
        '204': { description: "Removed (or already gone)." }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/versions/{versionId}/finalize:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
    post:
      operationId: SUB-05
      tags: [Student submission]
      summary: Finalize the upload and queue grading
      description: >-
        The listed files are the final set: a stored file that is not listed is dropped, and the files take the list's order
        as their ordinal. A second call for the version that is already stored returns the same 200 and changes nothing. 409 is UPLOAD_INCOMPLETE (details.missing),
        UPLOAD_NOT_OPEN, ATTEMPTS_EXHAUSTED, LATE_CLOSED, LOCKED_APPROVED or CLASS_ARCHIVED; 422 is FILE_LIMIT with
        details.limit total-size or grading-budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeRequest' }
      responses:
        '200':
          description: Submission queued (display state GRADING).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/files/{fileId}/url:
    parameters:
      - { $ref: '#/components/parameters/FileId' }
    get:
      operationId: FILE-01
      tags: [Files]
      summary: Get a five-minute link to a submission or announcement file
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUrl' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      operationId: INS-01
      tags: [Instructor review]
      summary: Get the Submission screen
      responses:
        '200':
          description: Submission for review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/approve:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-02
      tags: [Instructor review]
      summary: Approve (with optional score, feedback, and comment edits)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/submissions/{submissionId}/reopen:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-03
      tags: [Instructor review]
      summary: Reopen an approved submission (optionally grant attempts)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenRequest' }
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/assignments/{assignmentId}/students/{studentId}/grant-attempts:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
      - { $ref: '#/components/parameters/StudentId' }
    post:
      operationId: INS-04
      tags: [Instructor review]
      summary: Grant attempts to a student (give-back uses count 1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantAttemptsRequest' }
      responses:
        '200':
          description: New totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantAttemptsResult' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/assignments/{assignmentId}/students/{studentId}/allow-late:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
      - { $ref: '#/components/parameters/StudentId' }
    post:
      operationId: INS-05
      tags: [Instructor review]
      summary: Allow one student to submit after the due date
      responses:
        '200':
          description: Late allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowLateResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/submissions/{submissionId}/rerun:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-06
      tags: [Instructor review]
      summary: Re-run AI grading for a manual-review item (no attempt consumed)
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/submissions/{submissionId}/regrade:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-07
      tags: [Instructor review]
      summary: Re-grade an approved submission (result waits for review)
      responses:
        '202':
          description: Queued. The approved grade stays visible to the student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/submissions/{submissionId}/regrade/approve:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-08
      tags: [Instructor review]
      summary: Approve the pending re-grade result
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegradeApproveRequest' }
      responses:
        '200':
          description: New result is now the active grade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/submissions/{submissionId}/regrade/keep-previous:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-09
      tags: [Instructor review]
      summary: Discard the pending re-grade and keep the approved grade
      responses:
        '200':
          description: Pending result discarded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/submissions/{submissionId}/comment:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-10
      tags: [Instructor review]
      summary: Save or clear the instructor comment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/manual-grade:
    parameters:
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      operationId: INS-11
      tags: [Instructor review]
      summary: Enter a manual grade and approve it in one step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualGradeRequest' }
      responses:
        '200':
          description: Approved with the manual grade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSubmission' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/assignments/{assignmentId}/bulk-approve:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: BLK-01
      tags: [Bulk actions]
      summary: Approve unedited AI results in bulk (up to 200)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkApproveRequest' }
      responses:
        '200':
          description: Approved items and skipped items with reasons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkApproveResult' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/assignments/{assignmentId}/bulk-rerun:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: BLK-02
      tags: [Bulk actions]
      summary: Re-run AI grading for manual-review items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRerunRequest' }
      responses:
        '202':
          description: Batch started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/assignments/{assignmentId}/bulk-regrade:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    post:
      operationId: BLK-03
      tags: [Bulk actions]
      summary: Re-grade approved submissions in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRegradeRequest' }
      responses:
        '202':
          description: Batch started, with skipped items and reasons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/assignments/{assignmentId}/progress:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      operationId: BLK-04
      tags: [Bulk actions]
      summary: Progress of a batch (re-grade, re-run, or bulk approve)
      parameters:
        - { name: batchId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Batch progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/review-queue:
    get:
      operationId: REV-01
      tags: [Review queue]
      summary: List the review queue
      parameters:
        - { name: classId, in: query, schema: { type: string, format: uuid } }
        - { name: assignmentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [AI_GENERATED, NEEDS_MANUAL_REVIEW, PENDING_REGRADE] } }
        - { name: sort, in: query, schema: { type: string, enum: [flagged, submittedAt, late], default: flagged } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of review items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfReviewQueueItem' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/review-queue/count:
    get:
      operationId: REV-02
      tags: [Review queue]
      summary: Review queue counts for the header badge
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/assignments/{assignmentId}/tracker:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      operationId: TRK-01
      tags: [Tracker and gradebook]
      summary: Assignment submission tracker
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated instructor display states." }
        - { name: criteriaChanged, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Tracker counts, class statistics, and rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/export.csv:
    parameters:
      - { $ref: '#/components/parameters/AssignmentId' }
    get:
      operationId: TRK-02
      tags: [Tracker and gradebook]
      summary: Export the assignment as CSV (UTF-8 with BOM)
      responses:
        '200':
          description: CSV file.
          content:
            text/csv; charset=utf-8:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/classes/{classId}/gradebook:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      operationId: TRK-03
      tags: [Tracker and gradebook]
